name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest --cov=alexandria --cov-report=term-missing
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Build CSS
        run: npm ci && npm run build
