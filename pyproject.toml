[project]
name = "alexandria"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "flask-limiter>=4.1.1",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "loguru>=0.7.3",
    "pillow>=11.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["migrations", "instance"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Import ordering is not enforced yet; sorting would touch files other branches are editing.
ignore = ["I001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
"alexandria/blueprints/main.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"

[tool.coverage.run]
source = ["alexandria"]
omit = ["*/migrations/*"]
